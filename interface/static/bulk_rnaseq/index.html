<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gene Expression | Potato Research</title>
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link rel="stylesheet" href="/static/bulk_rnaseq/styles.css?v=20260907-navigation" />
    <link rel="stylesheet" href="/static/shared/feedback.css?v=20260819-feedback" />
    <link rel="stylesheet" href="/static/shared/announcement.css?v=20260906-compact">
    <script src="/static/shared/announcement.js?v=20260906" defer></script>
    <link rel="stylesheet" href="/static/shared/navigation.css?v=20260908-navigation-mobile-centered" />
    <script src="/static/shared/navigation.js?v=20260912-portal-link" defer></script>
    <link rel="stylesheet" href="/static/shared/agent-examples.css?v=20260909-simplified-chat" />
    <script src="/static/shared/agent-examples.js?v=20260910-http-fallback"></script>
  </head>
  <body>
    <div class="bulk-app">
      <header class="portal-header">
        <section class="portal-hero" aria-labelledby="portal-title">
          <div class="portal-hero-content">
            <h1 id="portal-title">PotatoOmics: An AI-powered multi-omics database for intelligent Q&amp;A and skills-based informatics analyses</h1>
          </div>
        </section>
        <nav class="portal-nav" aria-label="Portal modules" data-portal-module="bulk_rnaseq"></nav>
      </header>

      <main class="bulk-main">
        <section class="query-panel" aria-label="Gene expression query controls">
          <div class="query-heading agent-example-actions">
            <h2>Gene Expression Across Materials and Tissues</h2>
            <button id="ask-potato-agent" type="button" class="ghost ask-potato-agent">Ask Potato Agent</button>
          </div>

          <form id="query-form" class="query-form">
            <label class="field field-wide">
              <span>Gene IDs</span>
              <textarea id="genes-input" rows="4" spellcheck="false">DM8.2_chr05G25210</textarea>
            </label>

            <div class="control-grid">
              <label class="field">
                <span>Grouping</span>
                <select id="scope-select">
                  <option value="sample_tissue" selected>Material by tissue</option>
                  <option value="tissue">Tissue mean</option>
                  <option value="sample_name">Material mean</option>
                  <option value="sample">All runs</option>
                </select>
              </label>
              <label class="field">
                <span>Scale</span>
                <select id="transform-select">
                  <option value="log2_tpm" selected>log2(TPM + 1)</option>
                  <option value="row_zscore">Row z-score</option>
                  <option value="tpm">TPM</option>
                </select>
              </label>
            </div>

            <div class="query-actions">
              <button id="submit-button" type="submit" class="primary">Search</button>
            </div>
          </form>

          <section class="status-panel" aria-label="Gene expression database status">
            <h3>Dataset</h3>
            <div id="status-detail" class="detail-body muted">Loading status.</div>
          </section>

        </section>

        <section class="viewer-panel" aria-label="Gene expression heatmap">
          <div class="viewer-toolbar">
            <div>
              <div id="graph-title" class="graph-title">No query loaded</div>
              <div id="graph-summary" class="graph-summary">Enter one or more gene IDs.</div>
            </div>
            <div class="export-actions">
              <button id="download-pdf" type="button" class="icon-button" title="Download vector PDF" aria-label="Download vector PDF">PDF</button>
              <button id="download-tsv" type="button" class="icon-button export-data-button" title="Download TSV" aria-label="Download TSV">Export data</button>
            </div>
          </div>
          <div class="heatmap-stage">
            <canvas id="heatmap"></canvas>
            <div id="heatmap-empty" class="heatmap-empty">No expression loaded</div>
            <div id="heatmap-tooltip" class="heatmap-tooltip" role="tooltip" hidden></div>
          </div>
          <div class="legend-strip" aria-label="Heatmap color scale">
            <span id="legend-min">0</span>
            <div id="legend-bar" class="legend-bar"></div>
            <span id="legend-max">max</span>
          </div>
        </section>
      </main>
    </div>

    <script src="/static/shared/feedback.js?v=20260819-feedback" defer></script>
    <script src="/static/bulk_rnaseq/pdf_export.js?v=20260824-complete-export"></script>
    <script src="/static/bulk_rnaseq/app.js?v=20260909-examples"></script>
  </body>
</html>
