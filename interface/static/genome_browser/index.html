<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Genomes - Genome Browser | Potato Research</title>
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link rel="stylesheet" href="/static/genome_browser/styles.css?v=20260907-navigation" />
    <link rel="stylesheet" href="/static/shared/feedback.css?v=20260819-feedback" />
    <link rel="stylesheet" href="/static/shared/announcement.css?v=20260906-compact">
    <script src="/static/shared/announcement.js?v=20260906" defer></script>
    <link rel="stylesheet" href="/static/shared/navigation.css?v=20260908-navigation-mobile-centered" />
    <script src="/static/shared/navigation.js?v=20260912-portal-link" defer></script>
    <link rel="stylesheet" href="/static/shared/agent-examples.css?v=20260909-simplified-chat" />
    <script src="/static/shared/agent-examples.js?v=20260910-http-fallback"></script>
  </head>
  <body>
    <div class="genome-browser-app">
      <header class="portal-header">
        <section class="portal-hero" aria-labelledby="portal-title">
          <div class="portal-hero-content">
            <h1 id="portal-title">PotatoOmics: An AI-powered multi-omics database for intelligent Q&amp;A and skills-based informatics analyses</h1>
          </div>
        </section>
        <nav class="portal-nav" aria-label="Portal modules" data-portal-module="genome_browser"></nav>
      </header>

      <main class="browser-main">
        <section class="query-panel" aria-label="Genome browser controls">
          <div class="query-heading agent-example-actions">
            <div>
              <a class="parent-page-link" href="/genomes">&larr; Back to Genomes</a>
              <h2>Genome Browser</h2>
            </div>
            <button id="ask-potato-agent" type="button" class="ghost ask-potato-agent">Ask Potato Agent</button>
          </div>

          <form id="browser-form" class="query-form">
            <label class="field">
              <span>Genome Type</span>
              <select id="category-select" disabled>
                <option value="all">All genomes</option>
              </select>
            </label>

            <label class="field">
              <span>Assembly</span>
              <select id="assembly-select" disabled>
                <option value="">Loading...</option>
              </select>
            </label>

            <label class="field">
              <span>Location</span>
              <input id="location-input" type="text" spellcheck="false" autocomplete="off" placeholder="chr01:1..100000" />
            </label>

            <div class="query-actions">
              <button id="load-button" type="submit" class="primary" disabled>Load</button>
              <button id="reset-location-button" type="button" class="ghost" disabled>Default locus</button>
            </div>
          </form>

          <section class="status-panel" aria-label="Genome browser dataset status">
            <h3>Assembly</h3>
            <dl id="assembly-detail" class="detail-list">
              <div>
                <dt>Status</dt>
                <dd>Loading manifest</dd>
              </div>
            </dl>
          </section>
        </section>

        <section class="viewer-panel" aria-label="Genome browser viewer">
          <div class="viewer-toolbar">
            <div>
              <div id="browser-title" class="browser-title">No assembly loaded</div>
              <div id="browser-summary" class="browser-summary">Loading genome browser</div>
            </div>
          </div>
          <div class="browser-stage">
            <div id="jbrowse-linear-genome-view"></div>
            <div id="browser-empty" class="browser-empty">Loading genome browser</div>
          </div>
        </section>
      </main>
    </div>

    <script src="/static/genome_browser/vendor/react.production.min.js"></script>
    <script src="/static/genome_browser/vendor/react-dom.production.min.js"></script>
    <script src="/static/genome_browser/vendor/react-linear-genome-view.umd.production.min.js"></script>
    <script src="/static/shared/feedback.js?v=20260819-feedback" defer></script>
    <script src="/static/genome_browser/app.js?v=20260909-examples"></script>
  </body>
</html>
