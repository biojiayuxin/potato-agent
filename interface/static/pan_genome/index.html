<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pan-genome | Potato Research</title>
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link rel="stylesheet" href="/static/pan_genome/styles.css?v=20260927-genomes" />
    <link rel="stylesheet" href="/static/shared/feedback.css?v=20260819-feedback" />
    <link rel="stylesheet" href="/static/shared/announcement.css?v=20260927-genomes">
    <script src="/static/shared/announcement.js?v=20260906" defer></script>
    <link rel="stylesheet" href="/static/shared/navigation.css?v=20260908-navigation-mobile-centered" />
    <script src="/static/shared/navigation.js?v=20260927-genomes" defer></script>
    <link rel="stylesheet" href="/static/shared/agent-examples.css?v=20260909-simplified-chat" />
    <script src="/static/shared/agent-examples.js?v=20260927-genomes"></script>
  </head>
  <body>
    <div class="pan-genome-app">
      <header class="portal-header">
        <section class="portal-hero" aria-labelledby="portal-title">
          <div class="portal-hero-content">
            <h1 id="portal-title">PotatoOmics: An AI-powered multi-omics database for intelligent Q&amp;A and skills-based informatics analyses</h1>
          </div>
        </section>
        <nav class="portal-nav" aria-label="Portal modules" data-portal-module="pan_genome"></nav>
      </header>

      <main class="pan-genome-main">
        <header class="page-toolbar">
          <h2>Pan-genome</h2>
          <div class="agent-example-actions">
            <button id="ask-potato-agent" type="button" class="browser-button ask-potato-agent">Ask Potato Agent</button>
          </div>
        </header>

        <section class="pangenome-overview" aria-label="Pan-genome overview">
          <figure class="pangenome-figure">
            <div class="figure-frame">
              <img
                src="/static/pan_genome/assets/pan-genome.png"
                alt="Pan- and core-genome accumulation curves and orthogroup distribution across 135 potato genomes"
                width="2385"
                height="868"
              />
            </div>
            <figcaption>Potato pan-genome constructed from 135 diploid accessions.</figcaption>
          </figure>
        </section>

        <section class="catalog-panel" aria-labelledby="catalog-heading">
          <header class="catalog-heading">
            <div>
              <h3 id="catalog-heading">Genome accessions</h3>
              <p id="catalog-status" role="status" aria-live="polite">Loading accessions</p>
            </div>
          </header>

          <div class="catalog-controls">
            <label class="field">
              <span>Search</span>
              <input id="accession-search" type="search" autocomplete="off" spellcheck="false" placeholder="Search accession or DOI" disabled />
            </label>
            <label class="field">
              <span>Assembly Ploidy</span>
              <select id="ploidy-filter" disabled>
                <option value="all">All assembly ploidies</option>
                <option value="monoploid">Monoploid</option>
                <option value="phased_diploid">Phased diploid</option>
                <option value="phased_tetraploid">Phased tetraploid</option>
              </select>
            </label>
          </div>

          <div class="table-shell">
            <table>
              <thead>
                <tr>
                  <th scope="col">Accession</th>
                  <th scope="col">Assembly Ploidy</th>
                  <th scope="col">DOI</th>
                </tr>
              </thead>
              <tbody id="accession-table-body">
                <tr>
                  <td class="table-message" colspan="3">Loading genome accessions</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/static/shared/feedback.js?v=20260819-feedback" defer></script>
    <script src="/static/pan_genome/app.js?v=20260927-genomes"></script>
  </body>
</html>
