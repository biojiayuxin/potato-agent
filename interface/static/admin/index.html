<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Potato Agent 管理</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/admin/styles.css?v=20260906-admin-layout">
  <link rel="stylesheet" href="/static/shared/announcement.css?v=20260906-compact">
  <script src="/static/shared/announcement.js?v=20260906" defer></script>
</head>
<body>
  <main id="login-view" class="login-view">
    <section class="login-panel" aria-labelledby="login-title">
      <div class="brand-lockup">
        <img src="/favicon.ico" alt="" width="36" height="36">
        <div>
          <p class="product-name">Potato Agent</p>
          <h1 id="login-title">管理员登录</h1>
        </div>
      </div>
      <form id="login-form" novalidate>
        <label for="login">账号</label>
        <input id="login" name="login" type="text" autocomplete="username" maxlength="320" required>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button id="login-submit" class="primary-button" type="submit">登录</button>
      </form>
    </section>
  </main>

  <div id="dashboard-view" class="dashboard" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-lockup compact">
          <img src="/favicon.ico" alt="" width="30" height="30">
          <div>
            <p class="product-name">Potato Agent</p>
            <h1>监控面板</h1>
          </div>
        </div>
        <div class="account-actions">
          <span id="admin-name" class="admin-name"></span>
          <button id="signout" class="quiet-button" type="button">退出</button>
        </div>
      </div>
    </header>

    <section class="system-band" aria-labelledby="system-heading">
      <div class="content system-content">
        <div class="section-heading-row">
          <h2 id="system-heading">实时状态</h2>
        </div>
        <div id="system-grid" class="system-grid">
          <div class="metric"><span>CPU</span><strong id="cpu-value">--</strong></div>
          <div class="metric"><span>内存已用</span><strong id="memory-used">--</strong></div>
          <div class="metric"><span>内存可用</span><strong id="memory-available">--</strong></div>
          <div id="swap-metric" class="metric" hidden><span>Swap</span><strong id="swap-value">--</strong></div>
          <div class="metric load-metric"><span>负载 1 / 5 / 15</span><strong id="load-value">--</strong></div>
        </div>
        <p id="sample-time" class="sample-time"></p>
      </div>
    </section>

    <section class="announcement-band" aria-labelledby="announcement-heading">
      <div class="content announcement-content">
        <div class="section-heading-row">
          <h2 id="announcement-heading">全站通知</h2>
          <div class="announcement-heading-actions">
            <span id="announcement-state" role="status">正在加载</span>
            <button id="announcement-reload" class="icon-button" type="button" title="刷新通知" aria-label="刷新通知">&#8635;</button>
          </div>
        </div>
        <form id="announcement-form" novalidate>
          <div class="announcement-copy-grid">
            <label class="announcement-field" for="announcement-message">
              <span class="announcement-label">正文 <output id="announcement-count">0 / 500</output></span>
              <textarea id="announcement-message" rows="1" required></textarea>
            </label>
            <div class="announcement-field">
              <span>条幅预览</span>
              <div class="announcement-preview"><span id="announcement-preview-text"></span><span aria-hidden="true">&#215;</span></div>
            </div>
          </div>
          <div class="announcement-time-grid">
            <fieldset class="announcement-mode">
              <legend>开始方式</legend>
              <label><input type="radio" name="announcement-mode" value="immediate" checked>立即</label>
              <label><input type="radio" name="announcement-mode" value="scheduled">定时</label>
            </fieldset>
            <label class="announcement-field" for="announcement-start">开始时间（北京时间）
              <input id="announcement-start" type="datetime-local" step="1" disabled>
            </label>
            <label class="announcement-field" for="announcement-end">结束时间（北京时间，可留空）
              <input id="announcement-end" type="datetime-local" step="1">
            </label>
          </div>
          <p id="announcement-timing" class="announcement-timing"></p>
          <p id="announcement-result" class="announcement-result" role="status" hidden></p>
          <div class="announcement-actions">
            <button id="announcement-publish" class="primary-button" type="submit" disabled>发布</button>
            <button id="announcement-save" class="quiet-button" type="button" disabled>保存修改</button>
            <button id="announcement-withdraw" class="quiet-button" type="button" disabled>撤下</button>
          </div>
        </form>
      </div>
    </section>

    <section class="content overview-section" aria-labelledby="overview-heading">
      <div class="section-heading-row overview-heading">
        <h2 id="overview-heading">用户概览</h2>
      </div>

      <div class="summary-grid">
        <article class="summary-item">
          <span>用户数</span>
          <strong id="total-users">--</strong>
        </article>
        <article class="summary-item">
          <span>输入 Token</span>
          <strong id="total-input-tokens">--</strong>
        </article>
        <article class="summary-item">
          <span>输出 Token</span>
          <strong id="total-output-tokens">--</strong>
        </article>
        <article class="summary-item">
          <span>缓存读</span>
          <strong id="total-cache-read-tokens">--</strong>
        </article>
        <article class="summary-item">
          <span>Token 合计</span>
          <strong id="total-tokens">--</strong>
        </article>
      </div>

      <div class="controls" aria-label="用户筛选">
        <div id="window-control" class="segments" role="group" aria-label="统计窗口">
          <button type="button" data-window="24h" class="active" aria-pressed="true">24 小时</button>
          <button type="button" data-window="7d" aria-pressed="false">7 天</button>
          <button type="button" data-window="30d" aria-pressed="false">30 天</button>
        </div>
        <label class="select-field">
          <span>用户类型</span>
          <select id="type-filter">
            <option value="all">全部</option>
            <option value="formal">正式用户</option>
            <option value="temporary">临时用户</option>
            <option value="retired">已清理临时用户</option>
          </select>
        </label>
        <label class="search-field">
          <span>搜索</span>
          <input id="user-search" type="search" maxlength="100" placeholder="账号、邮箱或映射名">
        </label>
      </div>

      <div id="table-state" class="table-state" role="status">正在加载用户数据</div>
      <div id="table-wrap" class="table-wrap" hidden>
        <table>
          <thead>
            <tr>
              <th aria-sort="none"><button class="sort-heading" type="button" data-sort="user" title="点击按用户降序排列">用户</button></th>
              <th aria-sort="none"><button class="sort-heading" type="button" data-sort="runtime_active" title="点击按活跃降序排列">活跃</button></th>
              <th aria-sort="none"><button class="sort-heading" type="button" data-sort="created_at" title="点击按注册时间降序排列">注册时间</button></th>
              <th aria-sort="none"><button class="sort-heading" type="button" data-sort="input_tokens" title="点击按输入 Token 降序排列">输入 Token</button></th>
              <th aria-sort="none"><button class="sort-heading" type="button" data-sort="output_tokens" title="点击按输出 Token 降序排列">输出 Token</button></th>
              <th aria-sort="none"><button class="sort-heading" type="button" data-sort="cache_read_tokens" title="点击按缓存读降序排列">缓存读</button></th>
              <th aria-sort="none"><button class="sort-heading" type="button" data-sort="total_tokens" title="点击按 Token 合计降序排列">Token 合计</button></th>
              <th aria-sort="none"><button class="sort-heading" type="button" data-sort="request_count" title="点击按请求数降序排列">请求</button></th>
              <th aria-sort="none"><button class="sort-heading" type="button" data-sort="storage_bytes" title="点击按目录空间降序排列">目录空间</button></th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
      <nav id="pagination" class="pagination" aria-label="用户分页" hidden>
        <button id="previous-page" class="icon-button" type="button" title="上一页" aria-label="上一页">‹</button>
        <span id="page-label"></span>
        <button id="next-page" class="icon-button" type="button" title="下一页" aria-label="下一页">›</button>
      </nav>
    </section>

    <section class="cleanup-band" aria-labelledby="cleanup-heading">
      <div class="content cleanup-content">
        <div class="section-heading-row cleanup-heading-row">
          <div>
            <h2 id="cleanup-heading">文件清理</h2>
            <p id="cleanup-policy" class="cleanup-meta">正在加载清理状态</p>
          </div>
          <p id="cleanup-run" class="cleanup-run"></p>
        </div>
        <div id="cleanup-state" class="cleanup-state" role="status">正在加载清理状态</div>
        <div id="cleanup-data" hidden>
          <div class="cleanup-summary" aria-label="文件清理汇总">
            <div><span>候选</span><strong id="cleanup-candidates">--</strong><small id="cleanup-candidates-bytes">--</small></div>
            <div><span>已转历史</span><strong id="cleanup-staged">--</strong><small id="cleanup-staged-bytes">--</small></div>
            <div><span>到期</span><strong id="cleanup-due">--</strong><small id="cleanup-due-bytes">--</small></div>
            <div><span>永久删除</span><strong id="cleanup-purged">--</strong><small id="cleanup-purged-bytes">--</small></div>
            <div><span>历史现存</span><strong id="cleanup-history">--</strong><small id="cleanup-history-bytes">--</small></div>
          </div>
          <div class="cleanup-table-wrap">
            <div class="cleanup-table" role="table" aria-label="各用户文件清理状态">
              <div class="cleanup-table-header" role="row">
                <span role="columnheader">映射用户</span><span role="columnheader">状态</span><span role="columnheader">原因</span><span role="columnheader">候选</span><span role="columnheader">已转历史</span><span role="columnheader">到期</span><span role="columnheader">永久删除</span>
              </div>
              <div id="cleanup-users" role="rowgroup"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="/static/admin/app.js" defer></script>
</body>
</html>
